<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedor</title>
    <link rel="stylesheet" href="/frontend/CSS/Fornecedor.css">
</head>
<body>
    <main>
        <section id="cad-fornecedor" class="tela">
            <h1>Cadastrar Fornecedor</h1>
            <form onsubmit="salvarCadastro(event, 'Fornecedor')">
                <div class="form-group">
                    <label for="fornecedor-nome">Nome da Empresa / Fornecedor:</label>
                    <input type="text" id="fornecedor-nome" required>
                </div>
                <div class="form-group">
                    <label for="fornecedor-cnpj">CNPJ / Contato:</label>
                    <input type="text" id="fornecedor-cnpj" required>
                </div>
                <button type="submit">Salvar Fornecedor</button>
            </form>
        </section>
    </main>
    <script src="/frontend/JS/Fornecedor.js"></script>
</body>
</html>
