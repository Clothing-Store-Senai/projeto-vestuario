<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peças de Roupa - Módulos</title>
    <link rel="stylesheet" href="/frontend/CSS/PecRoupa.css">
</head>
<body>
    <header class="navbar"></header>

    <main class="container">
        <h2>Cadastrar Nova Peça de Roupa</h2>
        <form id="form-peca-roupa" class="form-cadastro">
            <div class="form-group">
                <label for="titulo-peca">Nome da Peça:</label>
                <input type="text" id="titulo-peca" required placeholder="Ex: Camiseta Oversized Preto">
            </div>
            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <select id="categoria" required>
                    <option value="Camisetas">Camisetas</option>
                    <option value="Calças">Calças</option>
                    <option value="Vestidos">Vestidos</option>
                    <option value="Jaquetas">Jaquetas</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tamanho">Tamanho:</label>
                <input type="text" id="tamanho" placeholder="Ex: P, M, G, GG, 42">
            </div>
            
            <button type="submit" class="btn-submit">Cadastrar e Criar Módulo</button>
        </form>

        <h2>Peças Salvas (Módulos)</h2>
        <div class="cards-grid" id="container-pecas">
            <div class="card-modulo">
                <span class="card-tag">Camisetas</span>
                <h3 class="card-titulo">Camiseta Cotton Basic</h3>
                <p class="card-detalhe"><strong>Tamanho:</strong> M</p>
                <button class="btn-excluir" onclick="removerCard(this)">Remover</button>
            </div>

            <div class="card-modulo">
                <span class="card-tag">Calças</span>
                <h3 class="card-titulo">Calça Jeans Slim Fit</h3>
                <p class="card-detalhe"><strong>Tamanho:</strong> 42</p>
                <button class="btn-excluir" onclick="removerCard(this)">Remover</button>
            </div>
        </div>
    </main>

    <script src="/frontend/JS/PecaRoupa.js"></script>
</body>
</html>
