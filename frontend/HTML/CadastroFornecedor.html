<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fornecedor</title>
    <link rel="stylesheet" href="/frontend/CSS/CadastroFornecedor.css">
</head>
<body>

    <header class="navbar"></header>

    <main class="container">
        <h2>Cadastro de Fornecedor</h2>
        <form id="form-fornecedor" class="form-cadastro">
            <div class="form-group">
                <label for="nome-empresa">Nome / Razão Social:</label>
                <input type="text" id="nome-empresa" name="nome-empresa" required placeholder="Ex: Tecidos & Cia Ltda">
            </div>

            <div class="form-group">
                <label for="cnpj">CNPJ / CPF:</label>
                <input type="text" id="cnpj" name="cnpj" required placeholder="00.000.000/0001-00">
            </div>

            <div class="form-group">
                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" name="email" required placeholder="contato@fornecedor.com">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" required placeholder="(11) 99999-9999">
            </div>

            <button type="submit" class="btn-submit">Salvar Fornecedor</button>
        </form>
    </main>

    <script src="/frontend/JS/CadastroFornecedor.js"></script>
</body>
</html>
